name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner's system python can carry Debian's EXTERNALLY-MANAGED marker,
      # which makes a plain pip install refuse. A pinned interpreter of our own
      # avoids depending on which image the runner happens to be.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the YAML parser
        run: |
          set -eu
          python3 -m pip install --quiet --disable-pip-version-check pyyaml

      # A clone is all a user gets. Every file the skill reads has to be in it.
      - name: Everything a clone needs is tracked
        run: |
          set -eu
          missing=0
          for f in README.md \
                   AGENTS.md \
                   LICENSE \
                   .claude-plugin/marketplace.json \
                   .agents/plugins/marketplace.json \
                   plugins/certora-autoprover/LICENSE \
                   plugins/certora-autoprover/.claude-plugin/plugin.json \
                   plugins/certora-autoprover/.claude-plugin/icon.png \
                   plugins/certora-autoprover/skills/certora-autoprover/SKILL.md \
                   plugins/certora-autoprover/skills/certora-autoprover/AUTOPROVER_REF \
                   plugins/certora-autoprover/skills/certora-autoprover/references/autosetup.md \
                   plugins/certora-autoprover/skills/certora-autoprover/references/property-classes.md \
                   plugins/certora-autoprover/skills/certora-autoprover/references/cvl-writing.md \
                   plugins/certora-autoprover/skills/certora-autoprover/references/cvl-pitfalls.md \
                   plugins/certora-autoprover/skills/certora-autoprover/references/prover-loop.md \
                   plugins/certora-autoprover/skills/certora-autoprover/references/timeout-resolver.md \
                   plugins/certora-autoprover/skills/certora-autoprover/evals/evals.json \
                   plugins/certora-autoprover-solana/LICENSE \
                   plugins/certora-autoprover-solana/.claude-plugin/plugin.json \
                   plugins/certora-autoprover-solana/.claude-plugin/icon.png \
                   plugins/certora-autoprover-solana/skills/certora-autoprover-solana/SKILL.md \
                   plugins/certora-autoprover-solana/skills/certora-autoprover-solana/AUTOPROVER_REF \
                   plugins/certora-autoprover-solana/skills/certora-autoprover-solana/references/property-classes.md \
                   plugins/certora-autoprover-solana/skills/certora-autoprover-solana/evals/evals.json; do
            if [ -z "$(git ls-files -- "$f")" ]; then
              echo "::error file=$f::$f is not tracked, so a clone will not have it"
              missing=1
            else
              echo "ok  $f"
            fi
          done
          [ "$missing" -eq 0 ]

      - name: JSON files are valid
        run: |
          set -eu
          found=0
          for m in $(git ls-files '*.json'); do
            found=1
            echo "== $m"
            python3 -m json.tool "$m" > /dev/null
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::no JSON file is tracked, and the plugin manifests are required"
            exit 1
          fi

      # The manifests restate SKILL.md's own words, and each plugin's version
      # string is written out in five places. This step keeps them from
      # drifting apart, for every plugin the marketplaces list.
      - name: Manifests agree with SKILL.md
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          import yaml

          errors = []

          def check(ok, msg):
              if not ok:
                  errors.append(msg)

          def frontmatter(path):
              """Return a SKILL.md's YAML frontmatter as a mapping, or None."""
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  return None
              end = text.find("\n---\n", 3)
              if end < 0:
                  return None
              try:
                  return yaml.safe_load(text[4:end])
              except yaml.YAMLError:
                  return None

          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          badges = dict(re.findall(
              r'<a href="([^"]+/SKILL\.md)"><img src="https://img\.shields\.io/badge/'
              r'version-([0-9A-Za-z.+-]+?)-', readme))
          licence = "GPL-3.0-only"
          licence_text = pathlib.Path("LICENSE").read_bytes()
          check(b"GNU GENERAL PUBLIC LICENSE" in licence_text and b"Version 3" in licence_text,
                "LICENSE is not the GPL version 3 text")

          claude_entries = json.load(open(".claude-plugin/marketplace.json"))["plugins"]
          agents_entries = {e["name"]: e
                            for e in json.load(open(".agents/plugins/marketplace.json"))["plugins"]}
          check(bool(claude_entries), "the claude marketplace lists no plugins")
          check({e["name"] for e in claude_entries} == set(agents_entries),
                "the claude and agents marketplaces list different plugins: "
                f"{sorted(e['name'] for e in claude_entries)} vs {sorted(agents_entries)}")

          # Skill installers that follow a repository (`npx skills update`)
          # find a moved skill again by its name, and only when no other
          # skill in the repository has that name.
          skill_dirs = {}
          for skill in sorted(pathlib.Path("plugins").glob("*/skills/*/SKILL.md")):
              skill_dirs.setdefault(skill.parent.name, []).append(str(skill.parent))
          for name, dirs in skill_dirs.items():
              check(len(dirs) == 1, f"skill name {name!r} is used by more than one skill: {dirs}")

          for claude in claude_entries:
              pname = claude["name"]
              root = pathlib.Path("plugins") / pname
              source = f"./plugins/{pname}"
              check(claude["source"] == source,
                    f"claude marketplace: {pname} source {claude['source']!r} != {source!r}")
              agents = agents_entries.get(pname)
              if agents is not None:
                  check(agents["source"] == {"source": "local", "path": source},
                        f"agents marketplace: {pname} source {agents['source']!r} "
                        f"is not the local {source!r} form")

              plugin_json = root / ".claude-plugin" / "plugin.json"
              if not plugin_json.is_file():
                  errors.append(f"{plugin_json} is missing")
                  continue
              plugin = json.load(open(plugin_json))
              check(plugin["name"] == pname, f"{plugin_json}: name {plugin['name']!r} != {pname!r}")

              described = {}
              for skill in sorted(root.glob("skills/*/SKILL.md")):
                  fm = frontmatter(skill)
                  if fm is None:
                      errors.append(f"{skill}: no valid YAML frontmatter")
                      continue
                  name = (fm.get("name") or "").strip()
                  desc = (fm.get("description") or "").strip()
                  version = str((fm.get("metadata") or {}).get("version") or "").strip()
                  check(bool(name), f"{skill}: frontmatter has no name")
                  check(name == skill.parent.name,
                        f"{skill}: name {name!r} does not match directory {skill.parent.name!r}")
                  check(bool(desc), f"{skill}: frontmatter has no description")
                  check(bool(version), f"{skill}: frontmatter has no metadata.version")
                  described[name] = (desc, version)
                  print(f"{skill}: name={name} version={version} description={len(desc)} chars")
              check(pname in described, f"{pname} has no {root}/skills/{pname}/SKILL.md")

              # The manifest description is a verbatim prefix of the skill's own
              # description, so a rewrite of SKILL.md that leaves the manifests
              # behind fails here instead of shipping.
              skill_desc, skill_version = described.get(pname, ("", ""))
              pdesc = plugin["description"]
              diverge = next(
                  (i for i, (a, b) in enumerate(zip(pdesc, skill_desc)) if a != b),
                  min(len(pdesc), len(skill_desc)),
              )
              check(skill_desc.startswith(pdesc),
                    f"{plugin_json} description is not a verbatim prefix of the SKILL.md "
                    f"description; they diverge at char {diverge}")
              check(len(pdesc) >= 120,
                    f"{plugin_json} description is {len(pdesc)} chars, too short to describe the skill")

              for label, entry in (("claude marketplace", claude), ("agents marketplace", agents)):
                  if entry is None:
                      continue
                  check(entry["version"] == plugin["version"],
                        f"{label}: {pname} version {entry['version']!r} != {plugin['version']!r}")
                  check(entry["description"] == pdesc,
                        f"{label}: {pname} description does not match {plugin_json}")

              # A plugin's version lives in five places. All five, or none of them, are true.
              skill_md = f"{root}/skills/{pname}/SKILL.md"
              check(skill_md in badges, f"README.md has no version badge linking to {skill_md}")
              versions = {
                  str(plugin_json): plugin["version"],
                  "claude marketplace": claude["version"],
                  "agents marketplace": agents["version"] if agents else None,
                  skill_md: skill_version,
                  "README.md badge": badges.get(skill_md),
              }
              check(len(set(versions.values())) == 1, f"{pname} version strings disagree: {versions}")

              # An installed plugin is a copy of its own directory and nothing
              # else, so it carries its own copy of the licence.
              check(plugin["license"] == licence, f"{plugin_json} license is {plugin['license']!r}")
              check(claude["license"] == licence,
                    f"claude marketplace: {pname} license is {claude['license']!r}")
              plugin_licence = root / "LICENSE"
              check(plugin_licence.is_file() and plugin_licence.read_bytes() == licence_text,
                    f"{plugin_licence} is not a copy of LICENSE")

              print(f"manifests agree: {pname} {plugin['version']} {licence}, "
                    f"description {len(pdesc)} of {len(skill_desc)} chars")

          if errors:
              sys.exit("\n".join(f"::error::{e}" for e in errors))
          PY

      # One pin per skill, and the only copy of it. The agent reads this file
      # in Phase 0, so a SHA written into prose is a second copy that will drift.
      - name: The AutoProver pins are files, and nothing duplicates them
        run: |
          set -eu
          pins=$(git ls-files 'plugins/*/skills/*/AUTOPROVER_REF')
          if [ -z "$pins" ]; then
            echo "::error::no plugins/*/skills/*/AUTOPROVER_REF is tracked"
            exit 1
          fi
          for pin in $pins; do
            ref=$(tr -d '[:space:]' < "$pin")
            if ! printf '%s' "$ref" | grep -qxE '[0-9a-f]{40}'; then
              echo "::error file=$pin::not a 40-character SHA: $ref"
              exit 1
            fi
            echo "ok  $pin is $ref"
          done
          if git ls-files '*.md' | xargs grep -nE '\b[0-9a-f]{40}\b' ; then
            echo "::error::a 40-character SHA appears in Markdown; the pin belongs only in AUTOPROVER_REF"
            exit 1
          fi
          echo "ok  no Markdown file carries a SHA"
